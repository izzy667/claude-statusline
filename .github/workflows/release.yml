name: Release

on:
  push:
    branches: [main]
    paths: [statusline.py]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Publish the script's version if it has no release yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(python3 statusline.py --version)"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::__version__ is not MAJOR.MINOR.PATCH: $version"
            exit 1
          fi
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is already released"
            exit 0
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --generate-notes
